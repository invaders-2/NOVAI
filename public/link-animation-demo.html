<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连线动效演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
canvas { display: block; }
.controls {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
}
.controls button {
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px;
    cursor: pointer; font-size: 13px; transition: all 0.2s;
    backdrop-filter: blur(10px);
}
.controls button:hover { background: rgba(255,255,255,0.15); }
.controls button.active { background: rgba(99,102,241,0.4); border-color: rgba(99,102,241,0.6); }
.label {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 12px; z-index: 10;
}
</style>
</head>
<body>
<div class="controls">
    <button class="active" onclick="setMode('dash')">流动虚线</button>
    <button onclick="setMode('particle')">光点粒子</button>
    <button onclick="setMode('both')">组合效果</button>
    <button onclick="setMode('pulse')">脉冲光波</button>
    <button onclick="toggleActive()">触发/停止任务流</button>
</div>
<div class="label">点击按钮切换动效模式 | 点击"触发任务流"模拟数据传输</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let mode = 'dash';
let taskActive = false;
let animFrame = 0;
let particles = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Nodes
const nodes = [
    { id: 0, x: 200, y: 200, w: 160, h: 80, label: '提示词输入', color: '#6366f1', type: 'input' },
    { id: 1, x: 500, y: 120, w: 160, h: 80, label: 'GPT-Image-2', color: '#8b5cf6', type: 'process' },
    { id: 2, x: 500, y: 300, w: 160, h: 80, label: 'Seedream 4.5', color: '#a855f7', type: 'process' },
    { id: 3, x: 800, y: 200, w: 160, h: 80, label: '图片输出', color: '#10b981', type: 'output' },
];

// Links (from node id -> to node id)
const links = [
    { from: 0, to: 1, active: false },
    { from: 0, to: 2, active: false },
    { from: 1, to: 3, active: false },
    { from: 2, to: 3, active: false },
];

function getLinkPath(link) {
    const fromNode = nodes[link.from];
    const toNode = nodes[link.to];
    const x1 = fromNode.x + fromNode.w;
    const y1 = fromNode.y + fromNode.h / 2;
    const x2 = toNode.x;
    const y2 = toNode.y + toNode.h / 2;
    const dx = x2 - x1;
    const cp1x = x1 + dx * 0.4;
    const cp2x = x2 - dx * 0.4;
    return { x1, y1, x2, y2, cp1x, cp1y: y1, cp2x, cp2y: y2 };
}

function drawBezierPath(p) {
    ctx.beginPath();
    ctx.moveTo(p.x1, p.y1);
    ctx.bezierCurveTo(p.cp1x, p.cp1y, p.cp2x, p.cp2y, p.x2, p.y2);
}

function drawNode(node) {
    const { x, y, w, h, label, color } = node;
    // Shadow
    ctx.shadowColor = color + '40';
    ctx.shadowBlur = 20;
    // Background
    ctx.fillStyle = '#1e1e3a';
    ctx.strokeStyle = color + '80';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
    // Port dots
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + w, y + h / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y + h / 2, 5, 0, Math.PI * 2);
    ctx.fill();
}

function drawDashFlow(link, time) {
    const p = getLinkPath(link);
    const isActive = link.active || taskActive;
    const speed = isActive ? 2.5 : 0.8;
    ctx.save();
    drawBezierPath(p);
    ctx.strokeStyle = isActive ? '#6366f1' : 'rgba(99,102,241,0.3)';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.setLineDash([8, 6]);
    ctx.lineDashOffset = -time * speed;
    ctx.stroke();
    ctx.restore();
}

function drawParticle(link, time) {
    const p = getLinkPath(link);
    const isActive = link.active || taskActive;
    if (!isActive) return;
    // Multiple particles per link
    for (let i = 0; i < 3; i++) {
        const t = ((time * 0.008 + i * 0.33) % 1);
        const x = bezierPoint(p.x1, p.cp1x, p.cp2x, p.x2, t);
        const y = bezierPoint(p.y1, p.cp1y, p.cp2y, p.y2, t);
        // Glow
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, 12);
        gradient.addColorStop(0, 'rgba(99,102,241,0.8)');
        gradient.addColorStop(0.5, 'rgba(139,92,246,0.3)');
        gradient.addColorStop(1, 'rgba(139,92,246,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fill();
        // Core
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawPulse(link, time) {
    const p = getLinkPath(link);
    const isActive = link.active || taskActive;
    const alpha = isActive ? 0.3 + 0.2 * Math.sin(time * 0.05) : 0.15 + 0.05 * Math.sin(time * 0.02);
    ctx.save();
    drawBezierPath(p);
    ctx.strokeStyle = `rgba(99,102,241,${alpha})`;
    ctx.lineWidth = isActive ? 4 : 2;
    ctx.shadowColor = '#6366f1';
    ctx.shadowBlur = isActive ? 15 : 5;
    ctx.stroke();
    ctx.restore();
}

function bezierPoint(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
}

function draw(time) {
    ctx.clearRect(0, 0, W, H);
    // Grid background
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // Draw links
    links.forEach(link => {
        if (mode === 'dash' || mode === 'both') drawDashFlow(link, time);
        if (mode === 'particle' || mode === 'both') drawParticle(link, time);
        if (mode === 'pulse') drawPulse(link, time);
    });
    // Draw nodes
    nodes.forEach(drawNode);
    animFrame = requestAnimationFrame(draw);
}

function setMode(m) {
    mode = m;
    document.querySelectorAll('.controls button').forEach((btn, i) => {
        if (i < 4) btn.classList.toggle('active', btn.textContent.includes(
            m === 'dash' ? '虚线' : m === 'particle' ? '粒子' : m === 'both' ? '组合' : '脉冲'
        ));
    });
}

function toggleActive() {
    taskActive = !taskActive;
    const btn = document.querySelectorAll('.controls button')[4];
    btn.classList.toggle('active', taskActive);
    btn.textContent = taskActive ? '停止任务流' : '触发任务流';
}

draw(0);
</script>
</body>
</html>
