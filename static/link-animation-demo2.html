<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连线动效方案 v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6f0; font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; color: #fff; }
.subtitle { font-size: 13px; color: #6b7a90; margin-bottom: 24px; }
.canvas-area { position: relative; width: 100%; max-width: 900px; height: 520px; background: #0f1420; border: 1px solid #1e2a3a; border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 120px; padding: 14px 16px; border-radius: 12px; background: #161d2e; border: 1px solid #2a3548; font-size: 13px; font-weight: 500; text-align: center; z-index: 2; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.node .icon { font-size: 22px; margin-bottom: 6px; }
.node.output { left: 60px; }
.node.input { right: 60px; }
.node.n1 { top: 60px; }
.node.n2 { top: 220px; }
.node.n3 { top: 380px; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #2a3548; background: #161d2e; color: #8b9ab0; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn:hover { border-color: #3a4a60; color: #c0cad8; }
.btn.active { border-color: #00d4aa; color: #00d4aa; background: rgba(0,212,170,0.08); }
.btn.trigger { border-color: #ff8844; color: #ff8844; }
.btn.trigger:hover { background: rgba(255,136,68,0.1); }
.btn.trigger.active { background: rgba(255,136,68,0.15); }
.label { font-size: 12px; color: #4a5a70; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h1>连线动效方案 v2</h1>
<p class="subtitle">点击切换不同动效风格，点击「模拟执行」看激活状态</p>

<div class="controls">
  <button class="btn active" onclick="setStyle(0)">流光尾迹</button>
  <button class="btn" onclick="setStyle(1)">能量脉冲</button>
  <button class="btn" onclick="setStyle(2)">呼吸光晕</button>
  <button class="btn" onclick="setStyle(3)">数据粒子流</button>
  <button class="btn" onclick="setStyle(4)">双色交织</button>
  <button class="btn trigger" id="triggerBtn" onclick="toggleActive()">模拟执行</button>
</div>

<div class="canvas-area" id="canvasArea">
  <svg class="links" id="svgLinks"></svg>
  <div class="node output n1"><div class="icon">📝</div>提示词</div>
  <div class="node output n2"><div class="icon">🖼️</div>参考图</div>
  <div class="node output n3"><div class="icon">⚙️</div>参数</div>
  <div class="node input n1"><div class="icon">🎨</div>生图</div>
  <div class="node input n2"><div class="icon">🎬</div>生视频</div>
  <div class="node input n3"><div class="icon">💬</div>对话</div>
</div>
<p class="label" id="styleLabel">流光尾迹 — 柔和光带沿线流动</p>

<script>
const svg = document.getElementById('svgLinks');
const canvas = document.getElementById('canvasArea');
let currentStyle = 0;
let isActive = false;
let animFrame = null;
let particles = [];

const links = [
  { from: {x: 180, y: 95}, to: {x: 660, y: 95} },
  { from: {x: 180, y: 255}, to: {x: 660, y: 255} },
  { from: {x: 180, y: 415}, to: {x: 660, y: 415} },
  { from: {x: 180, y: 95}, to: {x: 660, y: 255} },
  { from: {x: 180, y: 255}, to: {x: 660, y: 415} },
];

const styleLabels = [
  '流光尾迹 — 柔和光带沿线流动，速度缓慢',
  '能量脉冲 — 间歇性脉冲波沿线传递',
  '呼吸光晕 — 连线整体呼吸感明暗变化',
  '数据粒子流 — 小粒子快速沿线传输',
  '双色交织 — 两色光点交替沿线流动',
];

function getPath(link) {
  const dx = link.to.x - link.from.x;
  const cx1 = link.from.x + dx * 0.4;
  const cx2 = link.to.x - dx * 0.4;
  return `M${link.from.x},${link.from.y} C${cx1},${link.from.y} ${cx2},${link.to.y} ${link.to.x},${link.to.y}`;
}

function setStyle(idx) {
  currentStyle = idx;
  document.querySelectorAll('.btn:not(.trigger)').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('styleLabel').textContent = styleLabels[idx];
  particles = [];
  render();
}

function toggleActive() {
  isActive = !isActive;
  document.getElementById('triggerBtn').classList.toggle('active', isActive);
  render();
}

function render() {
  if (animFrame) cancelAnimationFrame(animFrame);
  svg.innerHTML = '';

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  svg.appendChild(defs);

  links.forEach((link, i) => {
    const path = getPath(link);
    // Base line
    const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    base.setAttribute('d', path);
    base.setAttribute('fill', 'none');
    base.setAttribute('stroke', isActive ? '#1e3a4a' : '#1a2535');
    base.setAttribute('stroke-width', '2');
    svg.appendChild(base);

    if (currentStyle === 0) renderFlowTrail(path, i, defs);
    else if (currentStyle === 1) renderEnergyPulse(path, i, defs);
    else if (currentStyle === 2) renderBreathGlow(path, i, defs);
    else if (currentStyle === 3) renderDataParticles(path, i, defs);
    else if (currentStyle === 4) renderDualColor(path, i, defs);
  });

  animate();
}

// Style 0: Flow trail
function renderFlowTrail(path, idx, defs) {
  const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  grad.id = 'flowGrad' + idx;
  grad.innerHTML = '<stop offset="0%" stop-color="#00d4aa" stop-opacity="0"/><stop offset="50%" stop-color="#00d4aa" stop-opacity="0.8"/><stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>';
  defs.appendChild(grad);

  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', `url(#flowGrad${idx})`);
  p.setAttribute('stroke-width', isActive ? '4' : '3');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-dasharray', '80 200');
  p.setAttribute('class', 'flow-line');
  p.dataset.offset = (idx * 60) % 280;
  svg.appendChild(p);
}

// Style 1: Energy pulse
function renderEnergyPulse(path, idx, defs) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#00b894');
  p.setAttribute('stroke-width', '2');
  p.setAttribute('stroke-dasharray', '4 12');
  p.setAttribute('class', 'pulse-line');
  p.dataset.offset = '0';
  p.dataset.speed = isActive ? '3' : '1';
  svg.appendChild(p);
}

// Style 2: Breath glow
function renderBreathGlow(path, idx, defs) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#00cec9');
  p.setAttribute('stroke-width', isActive ? '4' : '2.5');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('class', 'breath-line');
  p.dataset.phase = (idx * 1.2).toString();
  svg.appendChild(p);
}

// Style 3: Data particles
function renderDataParticles(path, idx, defs) {
  const count = isActive ? 5 : 3;
  for (let j = 0; j < count; j++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', isActive ? '4' : '3');
    c.setAttribute('fill', '#55efc4');
    c.setAttribute('opacity', '0.9');
    c.setAttribute('class', 'particle');
    c.dataset.t = (j / count).toString();
    c.dataset.speed = isActive ? '0.015' : '0.006';
    c.dataset.pathIdx = idx.toString();
    svg.appendChild(c);
  }
}

// Style 4: Dual color
function renderDualColor(path, idx, defs) {
  for (let j = 0; j < 2; j++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', isActive ? '5' : '3.5');
    c.setAttribute('fill', j === 0 ? '#00d4aa' : '#ff8844');
    c.setAttribute('opacity', '0.85');
    c.setAttribute('class', 'dual-particle');
    c.dataset.t = (j * 0.5).toString();
    c.dataset.speed = isActive ? '0.012' : '0.005';
    c.dataset.pathIdx = idx.toString();
    svg.appendChild(c);
  }
}

function animate() {
  const time = Date.now() / 1000;

  // Flow trail
  svg.querySelectorAll('.flow-line').forEach(p => {
    let offset = parseFloat(p.dataset.offset);
    offset += isActive ? 2.5 : 1;
    if (offset > 280) offset = 0;
    p.dataset.offset = offset;
    p.setAttribute('stroke-dashoffset', -offset);
  });

  // Energy pulse
  svg.querySelectorAll('.pulse-line').forEach(p => {
    let offset = parseFloat(p.dataset.offset);
    offset += parseFloat(p.dataset.speed);
    if (offset > 16) offset = 0;
    p.dataset.offset = offset;
    p.setAttribute('stroke-dashoffset', -offset);
    p.setAttribute('stroke', isActive ? '#00d4aa' : '#00b894');
  });

  // Breath glow
  svg.querySelectorAll('.breath-line').forEach(p => {
    const phase = parseFloat(p.dataset.phase);
    const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * 2 + phase));
    p.setAttribute('stroke-opacity', alpha);
    const width = isActive ? 3 + 2 * Math.sin(time * 2 + phase) : 2 + 1 * Math.sin(time * 1.5 + phase);
    p.setAttribute('stroke-width', width);
  });

  // Particles (style 3 & 4)
  svg.querySelectorAll('.particle, .dual-particle').forEach(c => {
    let t = parseFloat(c.dataset.t);
    t += parseFloat(c.dataset.speed);
    if (t > 1) t = 0;
    c.dataset.t = t;
    const idx = parseInt(c.dataset.pathIdx);
    const link = links[idx];
    const dx = link.to.x - link.from.x;
    const cx1 = link.from.x + dx * 0.4;
    const cx2 = link.to.x - dx * 0.4;
    const u = 1 - t;
    const x = u*u*u*link.from.x + 3*u*u*t*cx1 + 3*u*t*t*cx2 + t*t*t*link.to.x;
    const y = u*u*u*link.from.y + 3*u*u*t*link.from.y + 3*u*t*t*link.to.y + t*t*t*link.to.y;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
  });

  animFrame = requestAnimationFrame(animate);
}

// Init
render();
</script>
</body>
</html>
