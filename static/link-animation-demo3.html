<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连线动效方案 v3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6f0; font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; color: #fff; }
.subtitle { font-size: 13px; color: #6b7a90; margin-bottom: 24px; }
.canvas-area { position: relative; width: 100%; max-width: 900px; height: 520px; background: #0f1420; border: 1px solid #1e2a3a; border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 120px; padding: 14px 16px; border-radius: 12px; background: #161d2e; border: 1px solid #2a3548; font-size: 13px; font-weight: 500; text-align: center; z-index: 2; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.node .icon { font-size: 22px; margin-bottom: 6px; }
.node.output { left: 60px; }
.node.input { right: 60px; }
.node.n1 { top: 60px; }
.node.n2 { top: 220px; }
.node.n3 { top: 380px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #2a3548; background: #161d2e; color: #8b9ab0; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn:hover { border-color: #3a4a60; color: #c0cad8; }
.btn.active { border-color: #ffaa33; color: #ffaa33; background: rgba(255,170,51,0.08); }
.btn.trigger { border-color: #ff6b6b; color: #ff6b6b; }
.btn.trigger:hover { background: rgba(255,107,107,0.1); }
.btn.trigger.active { background: rgba(255,107,107,0.15); }
.label { font-size: 12px; color: #4a5a70; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h1>连线动效方案 v3</h1>
<p class="subtitle">更多风格，点击切换，点击「模拟执行」看激活态</p>

<div class="controls">
  <button class="btn active" onclick="setStyle(0)">流星拖尾</button>
  <button class="btn" onclick="setStyle(1)">电弧闪烁</button>
  <button class="btn" onclick="setStyle(2)">光纤传导</button>
  <button class="btn" onclick="setStyle(3)">萤火漫游</button>
  <button class="btn" onclick="setStyle(4)">波纹传递</button>
  <button class="btn" onclick="setStyle(5)">霓虹扫描</button>
  <button class="btn trigger" id="triggerBtn" onclick="toggleActive()">模拟执行</button>
</div>

<div class="canvas-area" id="canvasArea">
  <svg class="links" id="svgLinks"></svg>
  <div class="node output n1"><div class="icon">📝</div>提示词</div>
  <div class="node output n2"><div class="icon">🖼️</div>参考图</div>
  <div class="node output n3"><div class="icon">⚙️</div>参数</div>
  <div class="node input n1"><div class="icon">🎨</div>生图</div>
  <div class="node input n2"><div class="icon">🎬</div>生视频</div>
  <div class="node input n3"><div class="icon">💬</div>对话</div>
</div>
<p class="label" id="styleLabel">流星拖尾 — 明亮头部 + 渐隐尾迹</p>

<script>
const svg = document.getElementById('svgLinks');
let currentStyle = 0;
let isActive = false;
let animFrame = null;

const links = [
  { from: {x: 180, y: 95}, to: {x: 660, y: 95} },
  { from: {x: 180, y: 255}, to: {x: 660, y: 255} },
  { from: {x: 180, y: 415}, to: {x: 660, y: 415} },
  { from: {x: 180, y: 95}, to: {x: 660, y: 255} },
  { from: {x: 180, y: 255}, to: {x: 660, y: 415} },
];

const styleLabels = [
  '流星拖尾 — 明亮头部 + 渐隐尾迹，像流星划过',
  '电弧闪烁 — 不规则闪电线，科技感十足',
  '光纤传导 — 柔和光段沿线匀速传导',
  '萤火漫游 — 小光点沿线漂移，带随机抖动',
  '波纹传递 — 圆形波纹从起点扩散到终点',
  '霓虹扫描 — 一条亮线从头扫到尾',
];

function getPoint(link, t) {
  const dx = link.to.x - link.from.x;
  const cx1 = link.from.x + dx * 0.4;
  const cx2 = link.to.x - dx * 0.4;
  const u = 1 - t;
  return {
    x: u*u*u*link.from.x + 3*u*u*t*cx1 + 3*u*t*t*cx2 + t*t*t*link.to.x,
    y: u*u*u*link.from.y + 3*u*u*t*link.from.y + 3*u*t*t*link.to.y + t*t*t*link.to.y,
  };
}

function getPath(link) {
  const p1 = getPoint(link, 0);
  const p2 = getPoint(link, 0.33);
  const p3 = getPoint(link, 0.66);
  const p4 = getPoint(link, 1);
  return `M${p1.x},${p1.y} C${p2.x},${p2.y} ${p3.x},${p3.y} ${p4.x},${p4.y}`;
}

function setStyle(idx) {
  currentStyle = idx;
  document.querySelectorAll('.btn:not(.trigger)').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('styleLabel').textContent = styleLabels[idx];
  render();
}

function toggleActive() {
  isActive = !isActive;
  document.getElementById('triggerBtn').classList.toggle('active', isActive);
  render();
}

function render() {
  if (animFrame) cancelAnimationFrame(animFrame);
  svg.innerHTML = '';

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  svg.appendChild(defs);

  // Draw base lines
  links.forEach((link) => {
    const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    base.setAttribute('d', getPath(link));
    base.setAttribute('fill', 'none');
    base.setAttribute('stroke', isActive ? '#1e3a4a' : '#151e2e');
    base.setAttribute('stroke-width', '1.5');
    svg.appendChild(base);
  });

  if (currentStyle === 0) renderMeteor(defs);
  else if (currentStyle === 1) renderArc();
  else if (currentStyle === 2) renderFiber(defs);
  else if (currentStyle === 3) renderFirefly();
  else if (currentStyle === 4) renderRipple(defs);
  else if (currentStyle === 5) renderNeonScan(defs);

  animate();
}

// Style 0: Meteor trail
function renderMeteor(defs) {
  links.forEach((link, i) => {
    const grad = defs.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient'));
    grad.id = 'meteor' + i;
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.innerHTML = `<stop offset="0%" stop-color="#ffaa33" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffaa33" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="1"/>`;
    defs.appendChild(grad);

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', getPath(link));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', `url(#meteor${i})`);
    p.setAttribute('stroke-width', isActive ? '4' : '2.5');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-dasharray', '60 400');
    p.dataset.idx = i;
    p.dataset.offset = (i * 80) % 460;
    p.setAttribute('class', 'meteor-line');
    svg.appendChild(p);
  });
}

// Style 1: Electric arc
function renderArc() {
  links.forEach((link, i) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', getPath(link));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#44ddff');
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('stroke-linecap', 'round');
    p.dataset.idx = i;
    p.setAttribute('class', 'arc-line');
    svg.appendChild(p);
  });
}

// Style 2: Fiber optic
function renderFiber(defs) {
  links.forEach((link, i) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', getPath(link));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#33cc88');
    p.setAttribute('stroke-width', isActive ? '3' : '2');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-dasharray', '30 70');
    p.dataset.offset = (i * 20).toString();
    p.setAttribute('class', 'fiber-line');
    svg.appendChild(p);
  });
}

// Style 3: Firefly
function renderFirefly() {
  links.forEach((link, i) => {
    const count = isActive ? 4 : 2;
    for (let j = 0; j < count; j++) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', isActive ? '4' : '2.5');
      c.setAttribute('fill', '#ffcc44');
      c.setAttribute('opacity', '0.9');
      g.appendChild(c);
      // Glow
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      glow.setAttribute('r', isActive ? '8' : '5');
      glow.setAttribute('fill', '#ffcc44');
      glow.setAttribute('opacity', '0.2');
      g.appendChild(glow);
      g.dataset.t = (j / count).toString();
      g.dataset.speed = isActive ? '0.008' : '0.003';
      g.dataset.pathIdx = i;
      g.dataset.jitter = (Math.random() * 10).toString();
      g.setAttribute('class', 'firefly-g');
      svg.appendChild(g);
    }
  });
}

// Style 4: Ripple
function renderRipple(defs) {
  links.forEach((link, i) => {
    for (let j = 0; j < 3; j++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', '0');
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#ff7744');
      c.setAttribute('stroke-width', '2');
      c.setAttribute('opacity', '0');
      c.dataset.t = (j / 3).toString();
      c.dataset.speed = isActive ? '0.012' : '0.005';
      c.dataset.pathIdx = i;
      c.setAttribute('class', 'ripple-c');
      svg.appendChild(c);
    }
  });
}

// Style 5: Neon scan
function renderNeonScan(defs) {
  links.forEach((link, i) => {
    const grad = defs.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient'));
    grad.id = 'neon' + i;
    grad.innerHTML = `<stop offset="0%" stop-color="#ff4488" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff4488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6699" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff4488" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff4488" stop-opacity="0"/>`;
    defs.appendChild(grad);

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', getPath(link));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', `url(#neon${i})`);
    p.setAttribute('stroke-width', isActive ? '5' : '3');
    p.setAttribute('stroke-linecap', 'round');
    p.dataset.idx = i;
    p.dataset.pos = (i * 0.15).toString();
    p.setAttribute('class', 'neon-line');
    svg.appendChild(p);
  });
}

function animate() {
  const time = Date.now() / 1000;

  // Meteor
  svg.querySelectorAll('.meteor-line').forEach(p => {
    let offset = parseFloat(p.dataset.offset);
    offset += isActive ? 4 : 1.5;
    if (offset > 460) offset = 0;
    p.dataset.offset = offset;
    p.setAttribute('stroke-dashoffset', -offset);
  });

  // Arc - random jitter
  svg.querySelectorAll('.arc-line').forEach(p => {
    const link = links[parseInt(p.dataset.idx)];
    const pts = [];
    const segs = isActive ? 12 : 8;
    for (let j = 0; j <= segs; j++) {
      const t = j / segs;
      const pt = getPoint(link, t);
      const jitter = isActive ? 8 : 3;
      if (j === 0 || j === segs) {
        pts.push(`${pt.x},${pt.y}`);
      } else {
        pts.push(`${pt.x + (Math.random() - 0.5) * jitter},${pt.y + (Math.random() - 0.5) * jitter}`);
      }
    }
    p.setAttribute('d', 'M' + pts.join(' L'));
    p.setAttribute('stroke-opacity', 0.4 + Math.random() * 0.6);
    p.setAttribute('stroke-width', isActive ? 1 + Math.random() * 2 : 0.8 + Math.random());
  });

  // Fiber
  svg.querySelectorAll('.fiber-line').forEach(p => {
    let offset = parseFloat(p.dataset.offset);
    offset += isActive ? 2 : 0.8;
    if (offset > 100) offset = 0;
    p.dataset.offset = offset;
    p.setAttribute('stroke-dashoffset', -offset);
  });

  // Firefly
  svg.querySelectorAll('.firefly-g').forEach(g => {
    let t = parseFloat(g.dataset.t);
    t += parseFloat(g.dataset.speed);
    if (t > 1) t = 0;
    g.dataset.t = t;
    const idx = parseInt(g.dataset.pathIdx);
    const jitter = parseFloat(g.dataset.jitter);
    const pt = getPoint(links[idx], t);
    const jx = Math.sin(time * 3 + jitter) * (isActive ? 6 : 3);
    const jy = Math.cos(time * 2.5 + jitter) * (isActive ? 6 : 3);
    g.children[0].setAttribute('cx', pt.x + jx);
    g.children[0].setAttribute('cy', pt.y + jy);
    g.children[1].setAttribute('cx', pt.x + jx);
    g.children[1].setAttribute('cy', pt.y + jy);
    g.children[1].setAttribute('opacity', 0.15 + 0.1 * Math.sin(time * 4 + jitter));
  });

  // Ripple
  svg.querySelectorAll('.ripple-c').forEach(c => {
    let t = parseFloat(c.dataset.t);
    t += parseFloat(c.dataset.speed);
    if (t > 1) t = 0;
    c.dataset.t = t;
    const idx = parseInt(c.dataset.pathIdx);
    const pt = getPoint(links[idx], t);
    c.setAttribute('cx', pt.x);
    c.setAttribute('cy', pt.y);
    const r = isActive ? 8 + 6 * Math.sin(t * Math.PI) : 4 + 3 * Math.sin(t * Math.PI);
    c.setAttribute('r', r);
    c.setAttribute('opacity', (1 - t) * (isActive ? 0.8 : 0.5));
  });

  // Neon scan
  svg.querySelectorAll('.neon-line').forEach(p => {
    let pos = parseFloat(p.dataset.pos);
    pos += isActive ? 0.015 : 0.005;
    if (pos > 1.2) pos = -0.2;
    p.dataset.pos = pos;
    const grad = svg.querySelector('#neon' + p.dataset.idx);
    if (grad) {
      const stops = grad.querySelectorAll('stop');
      const center = pos * 100;
      stops[0].setAttribute('offset', Math.max(0, center - 15) + '%');
      stops[1].setAttribute('offset', Math.max(0, center - 5) + '%');
      stops[2].setAttribute('offset', center + '%');
      stops[3].setAttribute('offset', Math.min(100, center + 5) + '%');
      stops[4].setAttribute('offset', Math.min(100, center + 15) + '%');
    }
  });

  animFrame = requestAnimationFrame(animate);
}

render();
</script>
</body>
</html>
