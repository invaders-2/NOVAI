<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量生产</title>
<link rel="stylesheet" href="/static/css/theme.css?v=1.0.108.1786428400.1786205339">
<link rel="stylesheet" href="/static/css/marvis-shared.css?v=1.0.108.1786428400.1785603211">
<style>
body { background:var(--bg); color:var(--text); font-family:var(--font-sans); margin:0; min-height:100vh; }
.page { max-width:1200px; margin:0 auto; padding:24px 28px 60px; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.page-head h1 { font-size:22px; margin:0; font-weight:750; letter-spacing:.02em; }
.page-head .sub { color:var(--text-3); font-size:12px; margin-top:4px; }
.filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.tab { padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); font-size:13px; cursor:pointer; transition:.15s; }
.tab:hover { color:var(--text); border-color:var(--accent); }
.tab.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
.search { flex:1; min-width:200px; padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; outline:none; }
.search:focus { border-color:var(--accent); }
.stats { color:var(--text-3); font-size:12px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.card { background:var(--surface); border-radius:14px; overflow:hidden; border:1px solid var(--border); cursor:pointer; transition:transform .15s, border-color .15s; position:relative; }
.card:hover { transform:translateY(-2px); border-color:var(--accent); }
.card .thumb { aspect-ratio:1/1; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.card .thumb img, .card .thumb video { width:100%; height:100%; object-fit:cover; }
.card .badge { position:absolute; top:8px; left:8px; background:var(--overlay); color:var(--text); font-size:10px; padding:3px 8px; border-radius:6px; letter-spacing:.04em; }
.card .fav { position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:999px; border:0; background:var(--overlay); color:var(--text); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:.15s; }
.card .fav:hover { background:var(--accent); color:var(--accent-text); }
.card .fav.on { color:var(--warning); }
.card .meta { padding:10px 12px; }
.card .meta .name { font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .meta .info { font-size:11px; color:var(--text-3); margin-top:4px; display:flex; justify-content:space-between; }
.card .actions { display:flex; gap:6px; padding:0 12px 10px; }
.card .actions button { flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-2); font-size:11.5px; cursor:pointer; transition:.15s; }
.card .actions button:hover { color:var(--text); border-color:var(--accent); }
.empty { text-align:center; color:var(--text-3); padding:80px 0; font-size:14px; }
.modal-mask { position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-mask.show { display:flex; }
.modal { background:var(--surface); border-radius:16px; max-width:min(900px,92vw); max-height:88vh; overflow:auto; padding:20px; position:relative; }
.modal .close { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:999px; border:0; background:var(--surface-2); color:var(--text); cursor:pointer; font-size:16px; }
.modal img, .modal video { max-width:100%; max-height:70vh; border-radius:10px; display:block; margin:0 auto; }
.modal .m-name { text-align:center; color:var(--text-2); font-size:13px; margin-top:12px; }
.canvas-pick { position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; z-index:1001; }
.canvas-pick.show { display:flex; }
.pick-box { background:var(--surface); border-radius:16px; width:min(440px,90vw); padding:18px; }
.pick-box h3 { margin:0 0 12px; font-size:15px; }
.pick-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--border); margin-bottom:8px; cursor:pointer; transition:.15s; }
.pick-item:hover { border-color:var(--accent); }
.pick-item .t { font-size:13px; }
.pick-item .k { font-size:11px; color:var(--text-3); }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--accent); color:var(--text); padding:10px 20px; border-radius:10px; font-size:13px; z-index:2000; display:none; }
.toast.show { display:block; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* matrix 页面特有 */
.dim-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.dim-chip { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:12px; color:var(--text-2); }
.dim-chip b { color:var(--text); margin-right:6px; }
.stats-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.stats-legend { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:12px; color:var(--text-2); }
.stats-legend b { color:var(--text); }
.cells { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.cell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; transition:.15s; font-size:12px; color:var(--text-2); }
.cell:hover { border-color:var(--accent); }
.cell .st { display:inline-block; width:8px; height:8px; border-radius:999px; margin-right:6px; }
.cell.s-queued .st { background:var(--info); }
.cell.s-running .st { background:var(--warning); }
.cell.s-success .st { background:var(--success); }
.cell.s-failed .st { background:var(--danger); }
.cell.s-cancelled .st { background:var(--text-3); }
</style>
</head>
<body>
<div class="page">
  <!-- 列表视图 -->
  <div id="viewList">
    <div class="page-head">
      <div>
        <h1>批量生产 Matrix</h1>
        <div class="sub">维度笛卡尔积 → 批量生成任务 · V2 Phase 4</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="loadList()">刷新</button>
        <button class="btn primary" onclick="openCreate()">＋ 新建矩阵</button>
      </div>
    </div>
    <div class="stats-legend" id="listLegend"></div>
    <div class="grid" id="listGrid"></div>
    <div class="empty" id="listEmpty" style="display:none">
      <div class="big">还没有矩阵</div>
      点击右上角「新建矩阵」：定义维度（如 角色×产品×场景），系统自动生成全部组合单元格，一键批量执行
    </div>
  </div>

  <!-- 详情视图 -->
  <div id="viewDetail" style="display:none">
    <div class="page-head">
      <div class="detail-head">
        <button class="back" onclick="backToList()" title="返回列表">←</button>
        <div>
          <h2 id="dName"></h2>
          <div class="detail-sub" id="dSub"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="refreshDetail()">刷新</button>
        <button class="btn primary" id="btnRun" onclick="runMatrix()">▶ 运行</button>
        <button class="btn" id="btnCancel" onclick="cancelMatrix()">⏹ 取消</button>
        <button class="btn danger" onclick="deleteMatrix()">删除</button>
      </div>
    </div>
    <div class="dim-chips" id="dDims"></div>
    <div class="stats-bar" id="dStatsBar"></div>
    <div class="stats-legend" id="dLegend"></div>
    <div class="cells" id="dCells"></div>
  </div>
</div>

<!-- 新建矩阵弹窗 -->
<div class="modal-mask" id="createMask" onclick="if(event.target===this)closeCreate()">
  <div class="modal wide">
    <button class="close" onclick="closeCreate()">×</button>
    <h3>新建矩阵</h3>
    <div class="hint">矩阵 = 维度笛卡尔积。每个维度是一行（名称 + 逗号分隔的值），系统生成全部组合单元格；运行时每个单元格生成一个真实任务。</div>
    <div class="field">
      <label>矩阵名称</label>
      <input id="cName" placeholder="例如：电商主图批量生成" maxlength="120">
    </div>
    <div class="field">
      <label>维度（名称 + 值，多个值用英文逗号分隔）</label>
      <div id="cDims"></div>
      <button class="add-dim" onclick="addDimRow()">＋ 添加维度</button>
      <div class="count-preview" id="cCount"></div>
    </div>
    <div class="field">
      <label>生成参数模板（JSON，prompt 中可用 {维度名} 占位符）</label>
      <textarea id="cParams" spellcheck="false"></textarea>
      <div class="hint" style="margin-top:6px">例：{"prompt":"一张电商主图：{角色} 正在展示 {产品}，背景为 {场景}","provider_id":"comfly","model":"flux","size":"1024x1024","quality":"auto","n":1}</div>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeCreate()">取消</button>
      <button class="btn primary" onclick="createMatrix()">创建矩阵</button>
    </div>
  </div>
</div>

<!-- 任务详情弹窗 -->
<div class="modal-mask" id="taskMask" onclick="if(event.target===this)closeTask()">
  <div class="modal">
    <button class="close" onclick="closeTask()">×</button>
    <h3>任务详情</h3>
    <div id="taskBody"></div>
    <div class="foot">
      <button class="btn" id="taskRetryBtn" style="display:none" onclick="taskRetry()">重试</button>
      <button class="btn" id="taskCancelBtn" style="display:none" onclick="taskCancel()">取消任务</button>
      <button class="btn" onclick="closeTask()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_TEXT = { queued:'排队中', running:'执行中', success:'成功', failed:'失败', cancelled:'已取消' };
const STATUS_ORDER = ['total','queued','running','success','failed','cancelled'];
const STATUS_COLOR = { queued:'var(--st-queued)', running:'var(--st-running)', success:'var(--st-success)', failed:'var(--st-failed)', cancelled:'var(--st-cancelled)' };
let STATE = { view:'list', matrix:null, timer:null, taskId:null };

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ let d={}; try{ d = await r.json(); }catch(_){}
    const detail = (d.detail && typeof d.detail === 'string') ? d.detail : (Array.isArray(d.detail) ? JSON.stringify(d.detail[0]||{}).slice(0,200) : ('HTTP '+r.status));
    throw new Error(detail); }
  return r.json();
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ if(!ts) return '-'; const d=new Date(ts*1000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._h); showToast._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- 列表 ---------- */
async function loadList(){
  try{
    const d = await api('/api/matrices');
    renderList(d.items||[]);
  }catch(e){ showToast('加载失败: '+e.message); }
}
function renderList(items){
  const grid=document.getElementById('listGrid'), empty=document.getElementById('listEmpty');
  const legend=document.getElementById('listLegend');
  grid.innerHTML='';
  if(!items.length){ empty.style.display='block'; legend.innerHTML=''; return; }
  empty.style.display='none';
  const all={queued:0,running:0,success:0,failed:0,cancelled:0,total:0};
  items.forEach(m=>{ const s=m.stats||{}; STATUS_ORDER.forEach(k=>{ if(k!=='total') all[k]+=(s[k]||0); }); all.total+=(s.total||0); });
  legend.innerHTML = STATUS_ORDER.filter(k=>k!=='total').map(k=>`<span class="item"><span class="dot" style="background:${STATUS_COLOR[k]}"></span>${STATUS_TEXT[k]} ${all[k]}</span>`).join('') + `<span class="item">共 ${all.total} 个单元格</span>`;
  items.forEach(m=>{
    const s=m.stats||{};
    const dims=Object.entries(m.dimensions||{});
    const card=document.createElement('div');
    card.className='mcard';
    card.innerHTML=`
      <button class="delete" title="删除矩阵" onclick="event.stopPropagation();deleteMatrix('${m.matrix_id}')">✕</button>
      <div class="mname">${esc(m.name)}</div>
      <div class="mdims">${dims.map(([k,v])=>`<b>${esc(k)}</b>×${esc((v||[]).length)}`).join(' · ')}</div>
      <div class="mini">
        <span class="pill ${(s.success||0)>0?'ok':''}">✓ ${s.success||0}</span>
        <span class="pill ${(s.failed||0)>0?'bad':''}">✗ ${s.failed||0}</span>
        <span class="pill">⏳ ${(s.running||0)+(s.queued||0)}</span>
        <span>${fmtTime(m.created_at)}</span>
      </div>`;
    card.addEventListener('click', ()=>openDetail(m.matrix_id));
    grid.appendChild(card);
  });
}

/* ---------- 新建 ---------- */
function addDimRow(name='', vals=''){
  const box=document.getElementById('cDims');
  const row=document.createElement('div');
  row.className='dim-row';
  row.innerHTML=`
    <input class="dname" placeholder="维度名（如 角色）" value="${esc(name)}">
    <input class="dvals" placeholder="值，逗号分隔（如 厨师,模特,博主）" value="${esc(vals)}">
    <button class="del" onclick="this.parentElement.remove();previewCount()" title="删除维度">✕</button>`;
  row.querySelectorAll('input').forEach(i=>i.addEventListener('input', previewCount));
  box.appendChild(row);
  previewCount();
}
function collectDims(){
  const dims={};
  document.querySelectorAll('#cDims .dim-row').forEach(row=>{
    const n=row.querySelector('.dname').value.trim();
    const vals=row.querySelector('.dvals').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    if(n&&vals.length) dims[n]=vals;
  });
  return dims;
}
function previewCount(){
  const dims=collectDims();
  let n=1; Object.values(dims).forEach(v=>n*=v.length);
  const el=document.getElementById('cCount');
  el.textContent = Object.keys(dims).length ? `将生成 ${n} 个单元格（${Object.entries(dims).map(([k,v])=>`${k}×${v.length}`).join(' × ')||''}）` : '请添加至少一个维度';
}
function openCreate(){
  const box=document.getElementById('cDims');
  box.innerHTML='';
  addDimRow('角色','厨师,模特,博主');
  addDimRow('产品','咖啡机,耳机');
  addDimRow('场景','工作室,户外');
  document.getElementById('cName').value='';
  document.getElementById('cParams').value=JSON.stringify({prompt:'一张电商主图：{角色} 正在展示 {产品}，背景为 {场景}，高清商业摄影',provider_id:'comfly',model:'flux',size:'1024x1024',quality:'auto',n:1},null,2);
  document.getElementById('createMask').classList.add('show');
  previewCount();
}
function closeCreate(){ document.getElementById('createMask').classList.remove('show'); }
async function createMatrix(){
  const name=document.getElementById('cName').value.trim();
  const dims=collectDims();
  let params;
  try{ params=JSON.parse(document.getElementById('cParams').value||'{}'); }catch(e){ showToast('参数模板不是合法 JSON: '+e.message); return; }
  if(!name){ showToast('请填写矩阵名称'); return; }
  if(!Object.keys(dims).length){ showToast('请至少添加一个维度'); return; }
  if(!(params.prompt||'').trim()){ showToast('参数模板缺少 prompt（提示词模板）'); return; }
  try{
    const m=await api('/api/matrices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name, dimensions:dims, base_params:params})});
    closeCreate();
    showToast(`已创建「${m.name}」，共 ${m.stats.total} 个单元格`);
    openDetail(m.matrix_id);
  }catch(e){ showToast('创建失败: '+e.message); }
}

/* ---------- 详情 ---------- */
async function openDetail(id){
  STATE.view='detail'; STATE.matrixId=id;
  document.getElementById('viewList').style.display='none';
  document.getElementById('viewDetail').style.display='block';
  await refreshDetail();
  clearInterval(STATE.timer);
  STATE.timer=setInterval(refreshDetail, 3000);
}
function backToList(){
  clearInterval(STATE.timer); STATE.timer=null;
  STATE.view='list'; STATE.matrix=null;
  document.getElementById('viewDetail').style.display='none';
  document.getElementById('viewList').style.display='block';
  loadList();
}
async function refreshDetail(){
  if(STATE.view!=='detail') return;
  try{
    const m=await api('/api/matrices/'+STATE.matrixId);
    STATE.matrix=m;
    renderDetail(m);
  }catch(e){ if(STATE.view==='detail') showToast('详情刷新失败: '+e.message); }
}
function renderDetail(m){
  document.getElementById('dName').textContent=m.name;
  document.getElementById('dSub').textContent='ID '+m.matrix_id+' · 创建于 '+fmtTime(m.created_at)+' · 更新于 '+fmtTime(m.updated_at);
  document.getElementById('dDims').innerHTML=Object.entries(m.dimensions||{}).map(([k,v])=>`<span class="dim-chip"><b>${esc(k)}</b>${esc((v||[]).join(' / '))}</span>`).join('');
  // 统计条
  const s=m.stats||{};
  const bar=document.getElementById('dStatsBar');
  const total=Math.max(1,s.total||0);
  bar.innerHTML=STATUS_ORDER.filter(k=>k!=='total').map(k=>{
    const n=s[k]||0;
    if(!n) return `<div class="seg ${k} zero" data-k="${k}"></div>`;
    return `<div class="seg ${k}" data-k="${k}" style="width:${(n/total*100).toFixed(2)}%" title="${STATUS_TEXT[k]} ${n}">${n}</div>`;
  }).join('');
  document.getElementById('dLegend').innerHTML=STATUS_ORDER.filter(k=>k!=='total').map(k=>`<span class="item"><span class="dot" style="background:${STATUS_COLOR[k]}"></span>${STATUS_TEXT[k]} ${s[k]||0}</span>`).join('')+`<span class="item">共 ${s.total||0} 个单元格</span>`;
  // 单元格网格
  const cells=document.getElementById('dCells');
  cells.innerHTML='';
  (m.cells||[]).forEach(c=>{
    const div=document.createElement('div');
    div.className='cell';
    const st=c.status||'queued';
    const hasTask=!!c.task_id;
    div.innerHTML=`
      <div class="strip" style="background:${STATUS_COLOR[st]||'var(--st-queued)'}"></div>
      <div class="combo">${Object.entries(c.combo||{}).map(([k,v])=>`<span>${esc(k)}</span>：${esc(v)}`).join('<br>')}</div>
      <span class="cstatus ${hasTask?st:'norun'}">${hasTask?(STATUS_TEXT[st]||st):'未运行'}</span>
      <div class="ctask">${hasTask?esc(c.task_id):''}</div>`;
    div.addEventListener('click', ()=>{
      if(!c.task_id){ showToast('该单元格尚未运行（点击「运行」后生成任务）'); return; }
      openTask(c.task_id);
    });
    cells.appendChild(div);
  });
}
async function runMatrix(){
  const m=STATE.matrix; if(!m) return;
  if(!confirm(`运行「${m.name}」？将为 ${m.stats.total} 个单元格创建真实生成任务并进入执行队列（已结束的单元格会重新创建任务）。`)) return;
  try{
    const r=await api(`/api/matrices/${m.matrix_id}/run`,{method:'POST'});
    showToast(r.message||`已创建 ${r.launched} 个任务`);
    await refreshDetail();
  }catch(e){ showToast('运行失败: '+e.message); }
}
async function cancelMatrix(){
  const m=STATE.matrix; if(!m) return;
  if(!confirm(`取消「${m.name}」所有执行中/排队中的任务？`)) return;
  try{
    const r=await api(`/api/matrices/${m.matrix_id}/cancel`,{method:'POST'});
    showToast(r.message||`已受理 ${r.cancelled} 个取消`);
    await refreshDetail();
  }catch(e){ showToast('取消失败: '+e.message); }
}
async function deleteMatrix(id){
  const mid=id||(STATE.matrix&&STATE.matrix.matrix_id);
  if(!mid) return;
  if(!confirm('删除该矩阵记录？（已生成产物与任务历史不受影响）')) return;
  try{
    await api('/api/matrices/'+mid,{method:'DELETE'});
    showToast('已删除');
    if(STATE.view==='detail') backToList(); else loadList();
  }catch(e){ showToast('删除失败: '+e.message); }
}

/* ---------- 任务详情 ---------- */
const RAW_TEXT = { queued:'排队中', running:'执行中', provider_processing:'上游生成中', downloading:'下载中', saving:'保存中', succeeded:'成功', failed:'失败', cancelled:'已取消', cancel_requested:'取消中', retry:'重试中', jimeng_pending:'即梦排队中' };
async function openTask(taskId){
  STATE.taskId=taskId;
  document.getElementById('taskMask').classList.add('show');
  document.getElementById('taskBody').innerHTML='<div class="task-line"><span class="k">加载中</span><span class="v">…</span></div>';
  try{
    const t=await api('/api/tasks/'+taskId);
    renderTask(t);
  }catch(e){
    document.getElementById('taskBody').innerHTML=`<div class="task-line"><span class="k">错误</span><span class="v" style="color:#ff8a8f">${esc(e.message)}</span></div>`;
    document.getElementById('taskRetryBtn').style.display='none';
    document.getElementById('taskCancelBtn').style.display='none';
  }
}
function renderTask(t){
  const st=t.status||'queued';
  const stCls=['succeeded'].includes(st)?'success':(['failed'].includes(st)?'failed':(['cancelled','cancel_requested'].includes(st)?'cancelled':(['running','provider_processing','downloading','saving','jimeng_pending'].includes(st)?'running':'queued')));
  const imgs=[];
  const result=t.result;
  if(result&&typeof result==='object'){
    const urls=[];
    (result.images||[]).forEach(i=>{ if(typeof i==='string') urls.push(i); else if(i&&i.url) urls.push(i.url); });
    (result.urls||[]).forEach(u=>urls.push(u));
    if(result.url) urls.push(result.url);
    (result.videos||[]).forEach(v=>{ if(typeof v==='string') urls.push(v); else if(v&&v.url) urls.push(v.url); });
    urls.filter(Boolean).slice(0,8).forEach(u=>imgs.push(`<img src="${esc(u)}" loading="lazy" onclick="window.open('${esc(u)}','_blank')" title="点击放大">`));
  }
  const params=t.parameters||t.payload||{};
  document.getElementById('taskBody').innerHTML=`
    <div class="task-line"><span class="k">任务 ID</span><span class="v">${esc(t.id)}</span></div>
    <div class="task-line"><span class="k">状态</span><span class="v"><span class="task-status ${stCls}">${esc(RAW_TEXT[st]||st)}</span></span></div>
    <div class="task-line"><span class="k">类型</span><span class="v">${esc(t.kind||t.type||'-')}${t.matrix_id?' · Matrix: '+esc(t.matrix_name||t.matrix_id):''}</span></div>
    ${t.combo&&typeof t.combo==='object'&&Object.keys(t.combo).length?`<div class="task-line"><span class="k">组合</span><span class="v">${Object.entries(t.combo).map(([k,v])=>`${esc(k)}=${esc(v)}`).join('，')}</span></div>`:''}
    <div class="task-line"><span class="k">提供商</span><span class="v">${esc(t.provider_id||'-')} / ${esc(t.model||t.model_id||'-')}</span></div>
    <div class="task-line"><span class="k">创建时间</span><span class="v">${fmtTime(t.created_at)}</span></div>
    <div class="task-line"><span class="k">参数</span><span class="v"><pre>${esc(JSON.stringify(params,null,2).slice(0,1200))}</pre></span></div>
    ${t.error?`<div class="task-line"><span class="k">错误</span><span class="v" style="color:#ff8a8f">${esc(t.error)}</span></div>`:''}
    ${imgs.length?`<div class="result-imgs">${imgs.join('')}</div>`:''}
    <div class="transitions">${(t.transitions||[]).map(tr=>`<div class="transition"><span>${esc(tr.from||'—')}</span><span class="arrow">→</span><span>${esc(tr.to)}</span><span>${fmtTime(tr.at)}</span>${tr.error?`<span class="err" title="${esc(tr.error)}">${esc(String(tr.error).slice(0,80))}</span>`:''}</div>`).join('')}</div>`;
  const retryBtn=document.getElementById('taskRetryBtn'), cancelBtn=document.getElementById('taskCancelBtn');
  retryBtn.style.display=['failed','cancelled','jimeng_pending'].includes(st)?'':'none';
  cancelBtn.style.display=['succeeded','failed','cancelled','cancel_requested'].includes(st)?'none':'';
}
async function taskRetry(){
  if(!STATE.taskId) return;
  try{ const r=await api(`/api/tasks/${STATE.taskId}/retry`,{method:'POST'}); showToast('已重新排队'); openTask(STATE.taskId); }
  catch(e){ showToast('重试失败: '+e.message); }
}
async function taskCancel(){
  if(!STATE.taskId) return;
  try{ const r=await api(`/api/tasks/${STATE.taskId}/cancel`,{method:'POST'}); showToast('已受理取消'); openTask(STATE.taskId); }
  catch(e){ showToast('取消失败: '+e.message); }
}
function closeTask(){ document.getElementById('taskMask').classList.remove('show'); STATE.taskId=null; }

/* 回到列表时停止轮询 */
window.addEventListener('beforeunload', ()=>{ clearInterval(STATE.timer); });
loadList();
</script>
</body>
</html>
